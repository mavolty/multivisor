version: "3"
services:
  parent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["multivisor", "-c", "/etc/multivisor.conf"]
    ports:
      - 22000:22000
  personid:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["supervisord", "-c", "/etc/supervisord/personid.conf"]
    ports:
      - 9011:9001
  laravel:
    image: php:8.2-fpm
    volumes:
      - /var/www/riskv3/multivisor:/var/www/riskv3
